name: FootyStream Scraper

on:
  schedule:
    - cron: '*/30 * * * *'  # প্রতি ৩০ মিনিট পর পর অটো রান হবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার জন্য বাটন

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # গিটহাবে ফাইল কমিট ও পুশ করার অনুমতি নিশ্চিত করার জন্য

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Python script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_event_card.json all_event/ output_status.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: m3u8 playlists, json and status txt [skip ci]" && git push)
